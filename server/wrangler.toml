name = "achievement-hunter-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 90 zapytań na minutę z jednego IP — aplikacja przy sprawdzaniu wszystkich gier trzyma się poniżej
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 90, period = 60 }

# Klucz Steam NIE trafia do repo. Ustawiasz go raz:
#   npx wrangler secret put STEAM_KEY

workers_dev = true
preview_urls = false
